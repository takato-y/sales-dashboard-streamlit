name: test

on:
  push:
    branches: [main]
  pull_request:

# テストはリポジトリを読むだけなので、トークンの権限を読み取りに限定する
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # 性能のテスト（perf、10 万行を 10 秒以内）も含めて実行する
      - run: python -m pytest -v
